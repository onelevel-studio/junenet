<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Nouvel onglet – JuneNet</title>
<link rel="icon" href="junenet.ico">
<style>
body {
    background-color: #1e1e2f;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    color: white;
}

.container {
    text-align: center;
    position: relative;
}

.clock {
    position: absolute;
    top: -90px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
}

.clock #time {
    font-size: 42px;
    font-weight: bold;
    color: #e5e0ff;
    letter-spacing: 2px;
}

.clock #date {
    font-size: 14px;
    color: #9a94c2;
    text-transform: capitalize;
    margin-top: 4px;
}

.logo-title {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin-bottom: 25px;
}

.logo-title img {
    width: 64px;
    height: 64px;
}

h1 {
    color: #a78bfa;
    font-size: 64px;
    margin: 0;
}

input {
    width: 420px;
    padding: 15px;
    font-size: 18px;
    border-radius: 30px;
    border: none;
    outline: none;
}

input:focus {
    box-shadow: none;
}

/* Barre de recherche + sélecteur de moteur */
.search-bar {
    display: flex;
    align-items: center;
    width: 420px;
    background: white;
    border-radius: 30px;
    padding: 6px 6px 6px 6px;
    margin: 0 auto;
}

.search-bar:focus-within {
    box-shadow: 0 0 10px #a78bfa;
}

.search-bar input {
    width: auto;
    flex: 1;
    box-shadow: none !important;
}

.engine-selector {
    position: relative;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 8px;
    border-radius: 20px;
    cursor: pointer;
    user-select: none;
}

.engine-selector:hover {
    background: #eee7fb;
}

.engine-selector img {
    width: 20px;
    height: 20px;
    border-radius: 4px;
}

.engine-selector .arrow {
    font-size: 10px;
    color: #8a7cc9;
}

.engine-menu {
    position: absolute;
    top: 42px;
    left: 0;
    background: #2a2a3d;
    border-radius: 10px;
    overflow: hidden;
    display: none;
    z-index: 20;
    min-width: 160px;
}

.engine-menu.open {
    display: block;
}

.engine-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    color: white;
    font-size: 14px;
    white-space: nowrap;
}

.engine-option:hover {
    background: #3a3a55;
}

.engine-option.selected {
    background: #3a3a55;
    font-weight: bold;
}

.engine-option img {
    width: 18px;
    height: 18px;
    border-radius: 4px;
}

.engine-option.sugg-toggle {
    border-top: 1px solid #3a3a55;
    font-size: 12px;
    cursor: pointer;
}

body.light .engine-option.sugg-toggle {
    border-top-color: #e5deff;
}

/* Suggestions */
#suggestions {
    position: absolute;
    top: 170px;
    left: 50%;
    transform: translateX(-50%);
    width: 420px;
    background: #2a2a3d;
    border-radius: 12px;
    overflow: hidden;
    display: none;
    z-index: 10;
}

.suggestion {
    padding: 12px 20px;
    text-align: left;
    color: white;
    cursor: pointer;
}

.suggestion:hover,
.suggestion.selected {
    background: #3a3a55;
}

.suggestion strong {
    font-weight: bold;
    color: #a78bfa;
}

/* Liens rapides */
.quick-links {
    margin-top: 40px;
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
}

.quick-links a {
    text-decoration: none;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 14px;
    width: 90px;
    transition: transform 0.2s ease;
    position: relative;
}

.quick-links a:hover {
    transform: scale(1.1);
}

.quick-links img {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    margin-bottom: 6px;
    background: #2a2a3d;
    padding: 6px;
}

.quick-links .site-name {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.quick-links .visits {
    font-size: 11px;
    color: #9a94c2;
}

/* Thème clair */
body.light {
    background-color: #f4f2fb;
    color: #2a2140;
}

body.light .clock #time {
    color: #6d4fc4;
}

body.light .clock #date {
    color: #8a7cc9;
}

body.light input {
    background: white;
    color: #2a2140;
}

body.light #suggestions {
    background: #ffffff;
}

body.light .suggestion {
    color: #2a2140;
}

body.light .suggestion:hover,
body.light .suggestion.selected {
    background: #ece7fb;
}

body.light .quick-links a {
    color: #2a2140;
}

body.light .quick-links img {
    background: #ffffff;
}

body.light .search-bar {
    background: #ffffff;
    box-shadow: 0 0 0 1px #e5deff;
}

body.light .engine-selector:hover {
    background: #ece7fb;
}

body.light .engine-menu {
    background: #ffffff;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
}

body.light .engine-option {
    color: #2a2140;
}

body.light .engine-option:hover {
    background: #ece7fb;
}

.theme-toggle {
    position: absolute;
    top: -90px;
    right: -260px;
    background: #2a2a3d;
    border: none;
    color: #cfc9f0;
    padding: 8px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
}

body.light .theme-toggle {
    background: #ffffff;
    color: #6d4fc4;
}
</style>

<script>
/* ---------- Moteur de recherche ---------- */
const ENGINES = {
    google: {
        label: "Google",
        url: "https://www.google.com/search?q=",
        icon: "https://www.google.com/s2/favicons?sz=64&domain=google.com"
    },
    bing: {
        label: "Bing",
        url: "https://www.bing.com/search?q=",
        icon: "https://www.google.com/s2/favicons?sz=64&domain=bing.com"
    },
    duckduckgo: {
        label: "DuckDuckGo",
        url: "https://duckduckgo.com/?q=",
        icon: "https://www.google.com/s2/favicons?sz=64&domain=duckduckgo.com"
    },
    wikipedia: {
        label: "Wikipédia",
        url: "https://fr.wikipedia.org/w/index.php?search=",
        icon: "https://www.google.com/s2/favicons?sz=64&domain=wikipedia.org"
    },
    ecosia: {
        label: "Ecosia",
        url: "https://www.ecosia.org/search?q=",
        icon: "https://www.google.com/s2/favicons?sz=64&domain=ecosia.org"
    }
};

const ENGINE_STORAGE_KEY = "junenet_search_engine";
let currentEngine = "google";

function setEngine(name, persist = true) {
    if (!ENGINES[name]) return;

    currentEngine = name;
    document.getElementById("engine-icon").src = ENGINES[name].icon;
    document.getElementById("q").placeholder = "Rechercher sur " + ENGINES[name].label;

    document.querySelectorAll(".engine-option").forEach(opt => {
        opt.classList.toggle("selected", opt.dataset.engine === name);
    });

    if (persist) {
        try {
            localStorage.setItem(ENGINE_STORAGE_KEY, name);
        } catch (e) {
            // localStorage indisponible : on continue sans sauvegarde persistante.
        }
    }

    cancelSuggestions();
    closeEngineMenu();
}

function loadSavedEngine() {
    let saved = null;
    try {
        saved = localStorage.getItem(ENGINE_STORAGE_KEY);
    } catch (e) {
        saved = null;
    }
    setEngine(saved && ENGINES[saved] ? saved : "google", false);
}

function toggleEngineMenu(event) {
    if (event) event.stopPropagation();
    document.getElementById("engine-menu").classList.toggle("open");
}

function closeEngineMenu() {
    document.getElementById("engine-menu").classList.remove("open");
}

document.addEventListener("click", (e) => {
    const selector = document.getElementById("engine-selector");
    if (selector && !selector.contains(e.target)) {
        closeEngineMenu();
    }
});

/* ---------- Recherche + suggestions ---------- */

/* Échappe le texte avant de l'insérer dans du HTML (anti-XSS) */
function escapeHtml(str) {
    return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function escapeRegExp(str) {
    return str.replace(/[-\/\\^$*+?.()|[\]{}]/g, "\\$&");
}

/* Met en gras la partie tapée, en échappant tout le reste */
function highlightMatch(text, query) {
    if (!query) return escapeHtml(text);
    const regex = new RegExp("(" + escapeRegExp(query) + ")", "ig");
    return text
        .split(regex)
        .map((part, i) => i % 2 === 1
            ? "<strong>" + escapeHtml(part) + "</strong>"
            : escapeHtml(part))
        .join("");
}

/* Chaque moteur n'interroge QUE son propre service de suggestions.
   Ecosia n'a pas d'API publique de suggestions : aucune requête n'est envoyée. */
const SUGGEST_PROVIDERS = {
    google: {
        url: (q, cb) => "https://suggestqueries.google.com/complete/search?client=firefox&q="
            + encodeURIComponent(q) + "&callback=" + cb,
        parse: d => d && d[1]
    },
    bing: {
        url: (q, cb) => "https://api.bing.com/osjson.aspx?query="
            + encodeURIComponent(q) + "&JsonType=callback&JsonCallback=" + cb,
        parse: d => d && d[1]
    },
    duckduckgo: {
        url: (q, cb) => "https://duckduckgo.com/ac/?q="
            + encodeURIComponent(q) + "&callback=" + cb,
        parse: d => Array.isArray(d) ? d.map(x => x.phrase) : []
    },
    wikipedia: {
        url: (q, cb) => "https://fr.wikipedia.org/w/api.php?action=opensearch&format=json&limit=6&namespace=0&search="
            + encodeURIComponent(q) + "&callback=" + cb,
        parse: d => d && d[1]
    }
    // ecosia : volontairement absent
};

const SUGGEST_STORAGE_KEY = "junenet_suggestions_enabled";
const SUGGEST_DELAY_MS = 150;

let suggestionsEnabled = true;
let suggestTimer = null;
let suggestRequestId = 0;
let selectedIndex = -1;

/* Annule tout ce qui est en attente et ignore les réponses tardives */
function cancelSuggestions() {
    clearTimeout(suggestTimer);
    suggestTimer = null;
    suggestRequestId++;
    hideSuggestions();
}

function fetchSuggestions(q) {
    const provider = SUGGEST_PROVIDERS[currentEngine];
    if (!suggestionsEnabled || !provider) {
        hideSuggestions();
        return;
    }

    const id = ++suggestRequestId;
    const cbName = "__suggest_cb_" + id;
    const script = document.createElement("script");

    const cleanup = () => {
        delete window[cbName];
        script.remove();
    };

    window[cbName] = function (data) {
        cleanup();
        if (id !== suggestRequestId) return; // réponse périmée : on l'ignore
        let list = [];
        try { list = provider.parse(data) || []; } catch (e) { list = []; }
        showSuggestions(list.filter(t => typeof t === "string" && t));
    };

    script.onerror = cleanup;
    script.src = provider.url(q, cbName);
    document.body.appendChild(script);
}

function showSuggestions(list) {
    const box = document.getElementById("suggestions");
    const q = document.getElementById("q").value.trim();
    box.innerHTML = "";
    selectedIndex = -1;

    list.slice(0, 6).forEach(text => {
        const div = document.createElement("div");
        div.className = "suggestion";
        div.innerHTML = highlightMatch(text, q); // texte échappé par highlightMatch
        div.onclick = () => search(text);
        box.appendChild(div);
    });

    box.style.display = list.length ? "block" : "none";
}

function hideSuggestions() {
    document.getElementById("suggestions").style.display = "none";
    selectedIndex = -1;
}

function search(value = null) {
    const q = value || document.getElementById("q").value.trim();
    if (!q) return;
    cancelSuggestions();
    window.location.href = ENGINES[currentEngine].url + encodeURIComponent(q);
}

function onInput(e) {
    const q = e.value.trim();
    clearTimeout(suggestTimer);

    if (!q) {
        cancelSuggestions();
        return;
    }

    // Debounce : on attend la fin de la frappe avant d'interroger le moteur
    suggestTimer = setTimeout(() => fetchSuggestions(q), SUGGEST_DELAY_MS);
}

/* ---------- Activer / désactiver les suggestions ---------- */
function updateSuggToggle() {
    const el = document.getElementById("sugg-toggle");
    if (el) {
        el.textContent = "Suggestions : " + (suggestionsEnabled ? "activées ✓" : "désactivées");
    }
}

function toggleSuggestions(event) {
    if (event) event.stopPropagation();
    suggestionsEnabled = !suggestionsEnabled;
    try {
        localStorage.setItem(SUGGEST_STORAGE_KEY, suggestionsEnabled ? "1" : "0");
    } catch (e) {}
    if (!suggestionsEnabled) cancelSuggestions();
    updateSuggToggle();
}

function loadSuggestionsPref() {
    try {
        suggestionsEnabled = localStorage.getItem(SUGGEST_STORAGE_KEY) !== "0";
    } catch (e) {
        suggestionsEnabled = true;
    }
    updateSuggToggle();
}

/* Navigation au clavier dans les suggestions */
function onKey(e) {
    const box = document.getElementById("suggestions");
    const items = box.querySelectorAll(".suggestion");

    if (e.key === "Enter") {
        if (selectedIndex >= 0 && items[selectedIndex]) {
            search(items[selectedIndex].textContent);
        } else {
            search();
        }
        return;
    }

    if (!items.length || box.style.display === "none") return;

    if (e.key === "ArrowDown") {
        e.preventDefault();
        selectedIndex = (selectedIndex + 1) % items.length;
    } else if (e.key === "ArrowUp") {
        e.preventDefault();
        selectedIndex = (selectedIndex - 1 + items.length) % items.length;
    } else {
        return;
    }

    items.forEach(it => it.classList.remove("selected"));
    items[selectedIndex].classList.add("selected");
    document.getElementById("q").value = items[selectedIndex].textContent;
}

/* ---------- Horloge ---------- */
function updateClock() {
    const now = new Date();
    const time = now.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
    const date = now.toLocaleDateString("fr-FR", {
        weekday: "long", day: "numeric", month: "long"
    });
    document.getElementById("time").textContent = time;
    document.getElementById("date").textContent = date;
}

/* ---------- Thème clair / sombre ---------- */
function toggleTheme() {
    document.body.classList.toggle("light");
    const btn = document.getElementById("theme-toggle");
    btn.textContent = document.body.classList.contains("light") ? "🌙 Sombre" : "☀️ Clair";
}

/* ---------- Sites les plus visités ----------
   Les données proviennent du véritable historique de navigation de
   JuneNet, via un pont QWebChannel exposé par l'application Python
   (voir la classe Bridge dans JuneNet.py). */

/* Domaines entiers à ne pas proposer comme "sites visités" */
const HIDDEN_DOMAINS = ["ecosia.org"];

/* Pages précises à masquer (page d'accueil / nouvel onglet de JuneNet) */
const HIDDEN_URLS = [
    "https://onelevel-studio.github.io/junenet"
];

function normalizeUrl(url) {
    return (url || "")
        .toLowerCase()
        .replace(/^http:\/\//, "https://")
        .replace(/[?#].*$/, "")
        .replace(/\/+$/, "");
}

function getHost(site) {
    let host = site.domain;
    if (!host) {
        try { host = new URL(site.url).hostname; } catch (e) { host = ""; }
    }
    return host.replace(/^www\./, "").toLowerCase();
}

function isHidden(site) {
    const host = getHost(site);
    if (HIDDEN_DOMAINS.some(d => host === d || host.endsWith("." + d))) {
        return true;
    }

    const url = normalizeUrl(site.url);
    return HIDDEN_URLS.some(h => {
        const hidden = normalizeUrl(h);
        return url === hidden || url.startsWith(hidden + "/");
    });
}

/* Nom court dérivé du domaine : "www.youtube.com" -> "Youtube" */
function siteName(site) {
    const parts = getHost(site).split(".").filter(Boolean);
    if (!parts.length) return site.url;
    let name = parts.length === 1 ? parts[0] : parts[parts.length - 2];
    // gère les cas type "bbc.co.uk"
    if (parts.length > 2 && name.length <= 3) name = parts[parts.length - 3];
    return name.charAt(0).toUpperCase() + name.slice(1);
}

function renderTopSites(sites) {
    const container = document.getElementById("top-sites");
    container.innerHTML = "";

    if (!sites || !sites.length) return;

    sites.filter(site => !isHidden(site)).forEach(site => {
        const a = document.createElement("a");
        a.href = site.url;
        a.target = "_self";
        a.title = site.url;

        const img = document.createElement("img");
        img.src = "https://www.google.com/s2/favicons?sz=64&domain=" + encodeURIComponent(getHost(site));

        const name = document.createElement("span");
        name.className = "site-name";
        name.textContent = siteName(site);

        const visits = document.createElement("span");
        visits.className = "visits";
        visits.textContent = site.visits + " visite" + (site.visits > 1 ? "s" : "");

        a.append(img, name, visits);
        container.appendChild(a);
    });
}

function loadTopSites() {
    if (!window.junenetBridge) return;
    window.junenetBridge.topSites(function (result) {
        try {
            renderTopSites(JSON.parse(result));
        } catch (e) {
            console.error("Impossible de lire les sites les plus visités :", e);
        }
    });
}

function initBridge() {
    if (typeof qt === "undefined" || !qt.webChannelTransport) {
        // Page ouverte hors de JuneNet (navigateur classique) : pas de pont disponible.
        return;
    }
    new QWebChannel(qt.webChannelTransport, function (channel) {
        window.junenetBridge = channel.objects.bridge;
        loadTopSites();
    });
}

window.addEventListener("load", () => {
    updateClock();
    setInterval(updateClock, 30000);
    loadSuggestionsPref();
    loadSavedEngine();
    initBridge();
});
</script>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>

<body>

<div class="clock">
    <div id="time">--:--</div>
    <div id="date">chargement…</div>
</div>

<button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">☀️ Clair</button>

<div class="container">

    <div class="logo-title">
        <img src="junenet.png" alt="JuneNet">
        <h1>JuneNet</h1>
    </div>

    <div class="search-bar">
        <div class="engine-selector" id="engine-selector" onclick="toggleEngineMenu(event)">
            <img id="engine-icon" src="https://www.google.com/s2/favicons?sz=64&domain=google.com" alt="moteur">
            <span class="arrow">▾</span>

            <div class="engine-menu" id="engine-menu">
                <div class="engine-option selected" data-engine="google" onclick="setEngine('google')">
                    <img src="https://www.google.com/s2/favicons?sz=64&domain=google.com"> Google
                </div>
                <div class="engine-option" data-engine="bing" onclick="setEngine('bing')">
                    <img src="https://www.google.com/s2/favicons?sz=64&domain=bing.com"> Bing
                </div>
                <div class="engine-option" data-engine="duckduckgo" onclick="setEngine('duckduckgo')">
                    <img src="https://www.google.com/s2/favicons?sz=64&domain=duckduckgo.com"> DuckDuckGo
                </div>
                <div class="engine-option" data-engine="wikipedia" onclick="setEngine('wikipedia')">
                    <img src="https://www.google.com/s2/favicons?sz=64&domain=wikipedia.org"> Wikipédia
                </div>
                <div class="engine-option" data-engine="ecosia" onclick="setEngine('ecosia')">
                    <img src="https://www.google.com/s2/favicons?sz=64&domain=ecosia.org"> Ecosia
                </div>
                <div class="engine-option sugg-toggle" id="sugg-toggle" onclick="toggleSuggestions(event)">
                    Suggestions : activées ✓
                </div>
            </div>
        </div>

        <input id="q"
               type="text"
               placeholder="Rechercher sur Google"
               autofocus
               oninput="onInput(this)"
               onkeydown="onKey(event)">
    </div>

    <div id="suggestions"></div>

    <div class="quick-links">
        <a href="https://moi14212869.github.io/onelevel/" target="_self">
            <img src="https://moi14212869.github.io/onelevel/favicon.ico">
            <span>OneLevel</span>
        </a>

        <a href="https://anawan.io" target="_self">
            <img src="https://www.google.com/s2/favicons?sz=64&domain=anawan.io">
            <span>Anawan</span>
        </a>

        <a href="https://moi14212869.github.io/Fenyx" target="_self">
            <img src="https://moi14212869.github.io/Fenyx/logo2.png">
            <span>Fenyx Esport</span>
        </a>

        <span id="top-sites" style="display:contents"></span>
    </div>

</div>
</body>
</html>
